name: Bug report
description: Something does not work as described.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not paste tokens, keys, transcripts or code from your projects.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: dropdown
    id: part
    attributes:
      label: Part
      options:
        - Companion (t3-voice)
        - iPhone app
        - Both / not sure
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: T3 Code, Node, iOS, and the companion commit.
      placeholder: "T3 0.1.0, Node 24.1, iOS 18.5, companion abc1234"
  - type: textarea
    id: logs
    attributes:
      label: Companion log lines
      description: From `journalctl --user -u t3-voice`. Check them for secrets first.
      render: text
