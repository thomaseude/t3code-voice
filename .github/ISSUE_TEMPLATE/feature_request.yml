name: Feature request
description: Suggest something T3 Voice should do.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What do you want to do by voice, and what stops you today?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Idea
      description: How it could work. An example of what you would say helps.
