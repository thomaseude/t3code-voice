# PROTOTYPE — throwaway. Answers ticket #8 (locked-screen audio), then gets deleted.
# Generate the Xcode project with: xcodegen
name: LockedAudioProto
options:
  bundleIdPrefix: co.joombo.t3voice.proto
  deploymentTarget:
    iOS: "18.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1"
    # Set your Apple team id here, or pick the team in Xcode > Signing & Capabilities.
    DEVELOPMENT_TEAM: ""
packages:
  WebRTC:
    url: https://github.com/stasel/WebRTC
    exactVersion: 155.0.0
targets:
  LockedAudioProto:
    type: application
    platform: iOS
    sources: [App, Shared]
    dependencies:
      - package: WebRTC
      - target: LockedAudioWidget
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Voice Proto
        UILaunchScreen: {}
        UIBackgroundModes: [audio]
        NSMicrophoneUsageDescription: The prototype streams your voice to OpenAI Realtime to test locked-screen conversations.
        NSSupportsLiveActivities: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: co.joombo.t3voice.proto
  LockedAudioWidget:
    type: app-extension
    platform: iOS
    sources: [Widget, Shared]
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: Voice Proto Widget
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: co.joombo.t3voice.proto.widget
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) WIDGET_EXTENSION"
