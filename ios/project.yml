# The T3 Voice iOS app. Generate the Xcode project in this folder with: xcodegen
# The .xcodeproj is not committed: project.yml is the source.
name: T3Voice
options:
  bundleIdPrefix: co.joombo
  deploymentTarget:
    iOS: "18.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1"
    # Set your Apple team id here, or pick the team in Xcode > Signing & Capabilities.
    DEVELOPMENT_TEAM: ""
packages:
  WebRTC:
    url: https://github.com/stasel/WebRTC
    exactVersion: 155.0.0
targets:
  T3Voice:
    type: application
    platform: iOS
    sources: [App, Shared]
    dependencies:
      - package: WebRTC
      - target: T3VoiceWidget
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: T3 Voice
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSCameraUsageDescription: T3 Voice uses the camera to scan the pairing QR code that the companion shows.
        NSMicrophoneUsageDescription: T3 Voice sends your voice to the voice engine your companion opens, to talk to T3.
        NSFaceIDUsageDescription: T3 Voice asks for Face ID before each conversation, so that nobody else can drive T3 from your phone.
        NSSupportsLiveActivities: true
        # Keeps the conversation going with the screen locked.
        UIBackgroundModes: [audio]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: co.joombo.t3voice
  # The Live Activity (lock screen and Dynamic Island) with its End button.
  T3VoiceWidget:
    type: app-extension
    platform: iOS
    sources: [Widget, Shared]
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: T3 Voice
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: co.joombo.t3voice.widget
        # Shared/ code checks it to leave out what only the app has.
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) WIDGET_EXTENSION"
  T3VoiceTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: T3Voice
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: co.joombo.t3voice.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  T3Voice:
    build:
      targets:
        T3Voice: all
        T3VoiceTests: [test]
    test:
      targets: [T3VoiceTests]
